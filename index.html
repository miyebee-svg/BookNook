<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNook - Discover Your Next Great Read</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">📚 BookNook</div>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#books">Books</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <h1>Discover Your Next Great Read</h1>
        <p>Explore curated books, read reviews, and share your thoughts</p>
        <input type="text" id="searchBar" placeholder="Search books by title or author..." class="search-bar">
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Books Grid -->
        <section id="booksGrid" class="books-grid">
            <!-- Books will be dynamically inserted here -->
        </section>

        <!-- Book Detail Modal -->
        <div id="bookModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <div class="modal-body">
                    <div class="book-detail-left">
                        <img id="modalBookImage" src="" alt="Book Cover">
                    </div>
                    <div class="book-detail-right">
                        <h2 id="modalBookTitle"></h2>
                        <p class="author" id="modalBookAuthor"></p>
                        <div class="book-meta">
                            <span class="price" id="modalBookPrice"></span>
                            <div class="rating" id="modalBookRating"></div>
                        </div>
                        <p class="description" id="modalBookDescription"></p>
                        
                        <div class="action-buttons">
                            <button class="btn btn-submit" onclick="showReviewForm()">✍️ Submit Review</button>
                            <button class="btn btn-delete" onclick="deleteBook()">🗑️ Delete</button>
                        </div>

                        <!-- Review Form -->
                        <div id="reviewForm" class="review-form" style="display: none;">
                            <h3>Write a Review</h3>
                            <input type="text" id="reviewerName" placeholder="Your Name" class="form-input">
                            <div class="star-rating">
                                <span onclick="setRating(1)">★</span>
                                <span onclick="setRating(2)">★</span>
                                <span onclick="setRating(3)">★</span>
                                <span onclick="setRating(4)">★</span>
                                <span onclick="setRating(5)">★</span>
                            </div>
                            <textarea id="reviewText" placeholder="Write your review..." rows="3" class="form-input"></textarea>
                            <button class="btn btn-submit" onclick="submitReview()">Post Review</button>
                        </div>
                    </div>
                </div>

                <!-- Reviews Section -->
                <div class="reviews-section">
                    <h3>Reader Reviews</h3>
                    <div id="reviewsList" class="reviews-list">
                        <!-- Reviews will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 BookNook. Made with ❤️ for book lovers</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
